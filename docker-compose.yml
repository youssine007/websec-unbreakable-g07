services:
  backend:
    build: ./app/backend
    networks: [bw-services, appdb]
    environment:
      DATABASE_URL: "postgresql+psycopg://unbreakable:${DB_PASSWORD:?DB_PASSWORD ontbreekt}@db:5432/unbreakable"
      ALLOWED_ORIGINS: "https://g07.ipv6.thelastgym.be"
      OIDC_ISSUER: "https://g07.ipv6.thelastgym.be/auth/realms/unbreakable"
      OIDC_AUDIENCE: "unbreakable-api"
      OIDC_JWKS_URL: "http://keycloak:8080/auth/realms/unbreakable/protocol/openid-connect/certs"
    depends_on: [db, keycloak]
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_BASE_URL: "https://g07.ipv6.thelastgym.be"
        VITE_OIDC_AUTHORITY: "https://g07.ipv6.thelastgym.be/auth/realms/unbreakable"
        VITE_OIDC_CLIENT_ID: "unbreakable-spa"
    networks: [bw-services]
    depends_on: [backend]
    restart: unless-stopped

  db:
    image: postgres:17
    networks: [appdb]
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt}
    volumes: [dbdata:/var/lib/postgresql/data]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start
    networks: [bw-services, kcdb]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD ontbreekt}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD ontbreekt}
      KC_HOSTNAME: "https://g07.ipv6.thelastgym.be/auth"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on: [keycloak-db]
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    networks: [kcdb]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD ontbreekt}
    volumes: [kcdata:/var/lib/postgresql/data]
    restart: unless-stopped

volumes:
  dbdata:
  kcdata:

networks:
  appdb: { internal: true }
  kcdb: { internal: true }
  bw-services: { external: true }