services:
  app:
    build: ./app
    networks:
      - bw-services
      - appdb
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=${DB_PASSWORD:?DB_PASSWORD ontbreekt}"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17
    networks:
      - appdb
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dbdata:

networks:
  appdb:
    internal: true
  bw-services:
    external: true 
